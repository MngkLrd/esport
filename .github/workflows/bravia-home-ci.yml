name: BRAVIA HOME Stage 21 Sony Firmware Family Gate

on:
  push:
    branches:
      - feature/bravia-home-stage15
    paths:
      - 'bravia-lab/**'
      - '.github/workflows/bravia-home-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-and-native:
    name: Native HOME, QEMU ARM and Sony host simulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM tools, emulator and preview dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld qemu-user binutils build-essential python3-pil python3-cairosvg fonts-dejavu-core
      - name: Native C99, DirectFB draw and 30-logo host loader rollback regression
        run: make -C bravia-lab/native_core test adapter-test
      - name: Stage20 compile verified native app catalog as ARM32 ELF objects
        run: |
          clang -target armv7-linux-gnueabi -mfpu=vfpv4 -mfloat-abi=softfp -std=c99 -O2 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Wconversion -pedantic -Ibravia-lab/native_core -c bravia-lab/native_core/native_catalog.c -o /tmp/bravia-catalog-arm.o
          clang -target armv7-linux-gnueabi -mfpu=vfpv4 -mfloat-abi=softfp -std=c99 -O2 -ffreestanding -fno-builtin -Wall -Wextra -Werror -Wconversion -pedantic -Ibravia-lab/native_core -c bravia-lab/native_core/catalog_host.c -o /tmp/bravia-catalog-host-arm.o
          readelf -h /tmp/bravia-catalog-arm.o | grep -q 'Machine:.*ARM'
          readelf -h /tmp/bravia-catalog-host-arm.o | grep -q 'Machine:.*ARM'
      - name: Stage15 Linux and ARM ELF build and regression
        run: |
          sh bravia-lab/stage15/build.sh
          python3 -m unittest -v bravia-lab/stage15/test_demo.py
      - name: Stage16 simulated Sony host and renderer stress
        run: |
          make -C bravia-lab/stage16 test arm
          sh bravia-lab/stage16/build_arm.sh
          python3 -m unittest -v bravia-lab/stage16/test_cli.py
      - name: Run actual Stage15 and Stage16 ARM Linux ELFs using QEMU
        run: |
          printf 'hsdo+bq' | qemu-arm bravia-lab/stage15/build/bravia-home-armv7-linux-elf | tee /tmp/bravia-arm15.log
          grep -q 'view=home area=apps focus=1' /tmp/bravia-arm15.log
          printf 'hsdddobq' | qemu-arm bravia-lab/stage16/build/bravia-stage16-simulator-armv7-linux-elf | tee /tmp/bravia-arm16.log
          grep -q 'SIM owner=app' /tmp/bravia-arm16.log
          grep -q 'SIM owner=home' /tmp/bravia-arm16.log
          grep -q 'last=3' /tmp/bravia-arm16.log
          tail -n 1 /tmp/bravia-arm16.log | grep -q EXIT
      - name: Stage16 address and undefined behavior sanitizer test
        run: make -C bravia-lab/stage16 sanitize
      - name: Stage16 deterministic 250k-event randomized input/render audit
        run: make -C bravia-lab/stage16 fuzz fuzz-sanitize
      - name: Benchmark native simulation only, not Sony TV
        run: make -C bravia-lab/stage16 bench
      - name: Restore Stage8 ABI structure and Stage9 lifecycle guards from original repository
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -pedantic -c bravia-lab/stage8/sony_appclient_abi.c -o /tmp/bravia-stage8-abi.o
          gcc -std=c99 -O2 -Wall -Wextra -Werror -pedantic -Ibravia-lab/stage9 bravia-lab/stage9/lifecycle.c bravia-lab/stage9/test_lifecycle.c -o /tmp/bravia-stage9-test
          /tmp/bravia-stage9-test
      - name: Stage10-12 lifecycle and offline IPC observer unit tests
        run: |
          make -C bravia-lab/stage10 test
          make -C bravia-lab/stage11 test arm
          make -C bravia-lab/stage12 test fragment-test arm
      - name: Regenerate Stage14 native-command preview and ARM object
        run: |
          sh bravia-lab/stage14/build_arm.sh
          python3 bravia-lab/stage14/build_preview.py
          python3 bravia-lab/stage14/test_artifacts.py
      - name: Stage17 build 30 offline alpha-blurred logo textures
        run: python3 bravia-lab/stage17/build_assets.py
      - name: Stage17 verify fitted logos, source identity, command count and safe bounds
        run: python3 -m unittest -v bravia-lab/stage17/test_logo_assets.py
      - name: Stage17 build native C-command screenshots and keyboard demo
        run: python3 bravia-lab/stage17/build_preview.py
      - name: Archive Stage17 offline visual previews
        uses: actions/upload-artifact@v4
        with:
          name: bravia-home-stage17-logo-blur-preview
          path: |
            bravia-lab/stage17/assets/*.png
            bravia-lab/stage17/assets/manifest.json
            bravia-lab/stage17/previews/*.png
            bravia-lab/stage17/BRAVIA_HOME_v17_LOGO_BLUR_DEMO.html
          retention-days: 90
          if-no-files-found: error
      - name: Stage17 single-generator manifest and actual C UI_LOGO contract
        run: |
          python3 -m unittest -v bravia-lab/stage17/test_assets.py
      - name: Assemble reproducible non-installable Stage18 offline source bundle
        run: python3 bravia-lab/stage18/package_offline.py --output bravia-lab/stage18/BRAVIA_HOME_STAGE18_OFFLINE.zip
      - name: Archive Stage18 privacy-first source bundle (NOT Sony firmware)
        uses: actions/upload-artifact@v4
        with:
          name: bravia-home-stage18-offline-sources-not-installable
          path: bravia-lab/stage18/BRAVIA_HOME_STAGE18_OFFLINE.zip
          retention-days: 90
          if-no-files-found: error
      - name: Publish Linux and ARM research-only builds
        uses: actions/upload-artifact@v4
        with:
          name: bravia-home-stage16-offline-linux-demo
          path: |
            bravia-lab/stage15/build/bravia-home-linux-x86_64
            bravia-lab/stage15/build/bravia-home-armv7-linux-elf
            bravia-lab/stage16/console
            bravia-lab/stage16/build/bravia-stage16-simulator-armv7-linux-elf
          retention-days: 90
          if-no-files-found: error

  javascript:
    name: Navigation and mocked Sony catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Sony JS mock tests
        working-directory: bravia-lab
        run: node --test tests/test_*.cjs

  offline-python:
    name: No-proprietary-firmware Python tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage18 verify original 99 BRAVIA files and complete CI coverage
        working-directory: bravia-lab
        run: python3 -m unittest -v stage18/test_repo_integrity.py
      - name: Stage21 verify exact TV firmware version family and original OEM provenance gates
        working-directory: bravia-lab
        run: |
          python3 -m unittest -v stage21/test_firmware_preflight.py
          python3 stage21/firmware_preflight.py --tv-version 8.931-1000-4.000-0000
      - name: Stage19 stock native DockUI replacement content and Sony passthrough contract
        working-directory: bravia-lab
        run: python3 -m unittest -v stage19/test_stock_dockui_target.py
      - name: Stage18.2 audit first-party network and telemetry calls
        run: |
          python3 bravia-lab/stage18/privacy_audit.py --output bravia-lab/stage18/privacy_report.json
          cd bravia-lab
          python3 -m unittest -v stage18/test_privacy_audit.py stage18/test_firmware_privacy_scan.py stage18/test_package_offline.py
      - name: Run source-only firmware tests
        working-directory: bravia-lab
        run: |
          python -m unittest -v tests/test_firmware_lab.py tests/test_firmware_extended.py tests/test_audit_bloat.py tests/test_real_firmware_pipeline.py
      - name: No real device installation or modification
        run: echo 'Owner proprietary ELF not in GitHub; Sony hardware and signed update not tested.'

  browser:
    name: Restored Chromium / Playwright Sony mock integrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Chromium and Playwright for off-device QA
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import subprocess
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              chromium = playwright.chromium.executable_path
          subprocess.run(["sudo", "ln", "-sf", chromium, "/usr/bin/chromium"], check=True)
          PY
      - name: Restore original UI, Sony native bridge and catalog browser tests
        working-directory: bravia-lab
        run: python3 -m unittest -v tests/test_ui_v2_browser.py tests/test_native_sony_browser.py tests/test_catalog_browser.py stage18/test_browser_privacy.py
