name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Card pipeline smoke tests
        run: npm run test:cards
      - name: Typecheck and build
        run: npm run build
      - name: Build clean main source archive
        run: git archive --format=zip --output=esport-main.zip origin/main
      - name: Upload clean main source archive
        uses: actions/upload-artifact@v4
        with:
          name: esport-main-source
          path: esport-main.zip
          if-no-files-found: error
