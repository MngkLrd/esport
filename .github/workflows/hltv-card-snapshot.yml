name: HLTV card snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hltv-card-snapshots
    paths:
      - scripts/update-hltv-card-stats.py
      - src/players.ts
      - src/vrs.ts
      - src/playerMetadata.ts
      - .github/workflows/hltv-card-snapshot.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HLTV client dependency
        run: python -m pip install --disable-pip-version-check curl_cffi

      - name: Fetch current HLTV player cards
        run: >-
          python scripts/update-hltv-card-stats.py
          --end-date 2026-09-26
          --workers 6
          --output src/hltvCardStats.generated.ts
          --report data/hltv-card-report.json

      - name: Commit generated snapshot
        run: |
          if git diff --quiet -- src/hltvCardStats.generated.ts data/hltv-card-report.json; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hltvCardStats.generated.ts data/hltv-card-report.json
          git commit -m "data: refresh current HLTV card snapshot"
          git push origin HEAD:${GITHUB_REF_NAME}
